; GymPOS ESP32 Access Controller — PlatformIO Configuration
; Direct-Wired Relay Mode (No Solenoid GPIO drive)
; Buttonless Always-On Face Scanning Architecture
; Field wiring: LCD SDA=IO4 / SCL=IO5 (4-pin I2C: SDA, SCL, GND, 5V), Buzzer=10
; (RFID moved to an external USB reader on the PC side — no MFRC522 dep)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before
    no_reset
    --after
    hard_reset
build_flags =
    -D LOCK_PIN=-1
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before
    default_reset
    --after
    hard_reset
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
    -D LOCK_PIN=-1
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
