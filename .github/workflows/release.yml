name: GymPOS — Build & Publish Standalone Installer

# ═══════════════════════════════════════════════════════════════════════════════
# HOW TO SHIP AN UPDATE
# ═══════════════════════════════════════════════════════════════════════════════
#   1. Bump `version` in BOTH:
#        desktop/src-tauri/Cargo.toml
#        desktop/src-tauri/tauri.conf.json          ← must match exactly
#   2. Commit all changes and push to main.
#   3. Tag and push the tag:
#        git tag v0.2.0
#        git push origin v0.2.0
#   4. GitHub Actions builds the NSIS installer (ONNX models bundled inside),
#      signs it, and creates a GitHub Release with latest.json for auto-update.
#   5. Running terminals self-update on next launch — no manual steps at gym.
#
# SECRETS REQUIRED (Settings → Secrets → Actions):
#   TAURI_SIGNING_PRIVATE_KEY  — minisign private key
#   GITHUB_TOKEN               — automatic, no setup needed
# ═══════════════════════════════════════════════════════════════════════════════

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows-installer:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Rust toolchain ──────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── 3. Rust build cache ────────────────────────────────────────────────
      # NOTE: path is relative to the repo root (no gympos-saas/ prefix)
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      # ── 4. Node.js (Tauri CLI bundler dependency) ─────────────────────────
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ── 5. Verify ONNX models exist (fail fast) ───────────────────────────
      # Paths are relative to the repo root as checked out by actions/checkout
      - name: Verify ONNX models are present
        shell: pwsh
        run: |
          $models = @(
            "desktop/models/face_detection_yunet_2023mar.onnx",
            "desktop/models/face_recognition_sface_2021dec.onnx",
            "desktop/models/yolov8n.onnx"
          )
          foreach ($m in $models) {
            if (-not (Test-Path $m)) {
              Write-Error "Missing model: $m — cannot build standalone installer."
              exit 1
            }
            $sz = [math]::Round((Get-Item $m).Length / 1MB, 1)
            Write-Host "  OK $m ($sz MB)"
          }

      # ── 6. Build + publish via tauri-action ──────────────────────────────
      #    Reads tauri.conf.json, compiles Rust binary, runs NSIS bundler
      #    (ONNX models in resources: ../models/*), signs installer, creates
      #    GitHub Release with latest.json for auto-updater.
      - name: Build and publish installer (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "GymPOS ${{ github.ref_name }}"
          releaseBody: |
            ## GymPOS ${{ github.ref_name }} — Standalone Installer

            ### What's included
            - GymPOS desktop application (fully offline-capable)
            - ONNX AI models bundled (face detection/recognition + anti-tailgate YOLOv8)
            - Owner-issued staff PINs only — no default credentials (create staff in the Owner Portal)
            - Auto-updater (terminals self-update from this release, signature-verified)

            ### Installation
            1. Download `GymPOS_*_x64-setup.exe`
            2. Run as Administrator → installs to `Program Files\GymPOS\`
            3. Launch from Desktop shortcut

            ### First launch
            The terminal starts locked with an empty catalog. The gym owner creates staff PINs, products, plans and promos in the Owner Portal — they sync to the terminal automatically.

            ### Auto-Update
            Running terminals on older versions detect this release on next launch
            and install the update automatically. No manual steps required at the gym.
          releaseDraft: false
          prerelease: false
          projectPath: desktop/src-tauri
