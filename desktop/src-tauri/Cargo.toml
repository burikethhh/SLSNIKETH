[package]
name = "gympos-desktop"
version = "0.2.4"
description = "GymPOS SaaS Local Desktop Client"
authors = ["GymPOS Team"]
edition = "2021"

[lib]
name = "gympos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
gympos-shared = { path = "../../shared" }
tauri = { version = "2.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
rsa = "0.9"
sha2 = "0.10"
aes-gcm = "0.10"
tauri-plugin-single-instance = "2"
argon2 = "0.5"
jsonwebtoken = "9"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
serialport = "4.5"
parking_lot = "0.12"
machine-uid = "0.5"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tract-onnx = "0.21"
instant-distance = "0.6"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-updater = "2"
