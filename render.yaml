services:
  - type: web
    name: gympos-cloud
    env: rust
    buildCommand: cargo build --release --package gympos-cloud
    startCommand: ./target/release/gympos-cloud
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    # NOTE: no `disk` block on purpose — Render rejects disks on free
    # instances (deploy fails), and SQLite on the ephemeral filesystem wipes
    # on every restart. All durable state lives in gympos-db (Postgres) via
    # DATABASE_URL. Paid plans can add a disk later for file caches if needed.
    envVars:
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: gympos-db
          property: connectionString
      # CEO platform access is an email+password account (cloud_ceo_accounts),
      # created once via the Command Center First-Time Setup tab — no shared
      # master key env var is needed anymore.
      # REQUIRED for production: without this, the server signs licenses with
      # a throwaway key that changes on every restart, invalidating all
      # previously issued licenses. Generate one with:
      #   cargo run --bin gen_keys -p gympos-cloud
      # then paste the resulting PKCS#8 private key PEM here as a secret
      # (Render dashboard -> Environment -> Add Secret File/Env Var).
      - key: RSA_PRIVATE_KEY_PEM
        sync: false
      # HMAC secret for CEO/owner session tokens. Without it the secret is
      # derived from the RSA private key (stable while that key is stable) —
      # set this to rotate session tokens independently of license keys.
      # Generate with: openssl rand -hex 32
      - key: CEO_TOKEN_SECRET
        sync: false
      # When set, even the FIRST CEO registration requires this secret
      # (Command Center "First-Time Setup" tab asks for it). Prevents a
      # first-come-first-served CEO takeover on a fresh/empty database.
      - key: CEO_BOOTSTRAP_SECRET
        sync: false
      # OPTIONAL: only needed if an external site must call the API
      # cross-origin. The dashboards are same-origin and desktop terminals
      # don't enforce CORS, so leave unset for the default (no CORS headers,
      # browsers enforce same-origin). Example value: https://example.com
      - key: ALLOWED_CORS_ORIGIN
        sync: false

databases:
  - name: gympos-db
    plan: free
    region: oregon
