services:
  - type: web
    name: gympos-cloud
    env: rust
    buildCommand: cargo build --release --package gympos-cloud
    startCommand: ./target/release/gympos-cloud
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: gympos-db
          property: connectionString

databases:
  - name: gympos-db
    plan: free
    region: oregon
