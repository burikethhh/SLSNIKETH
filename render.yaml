services:
  - type: web
    name: gympos-cloud
    env: rust
    buildCommand: cargo build --release --package gympos-cloud
    startCommand: ./target/release/gympos-cloud
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: RUST_LOG
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: gympos-db
          property: connectionString
      # CEO platform access is an email+password account (cloud_ceo_accounts),
      # created once via the Command Center First-Time Setup tab — no shared
      # master key env var is needed anymore.
      # REQUIRED for production: without this, the server signs licenses with
      # a throwaway key that changes on every restart, invalidating all
      # previously issued licenses. Generate one with:
      #   cargo run --bin gen_keys -p gympos-cloud
      # then paste the resulting PKCS#8 private key PEM here as a secret
      # (Render dashboard -> Environment -> Add Secret File/Env Var).
      - key: RSA_PRIVATE_KEY_PEM
        sync: false

databases:
  - name: gympos-db
    plan: free
    region: oregon
